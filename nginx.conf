server {
  listen       8080;
  listen  [::]:8080;
  server_name  _;

  gzip on;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript;
  gzip_min_length 1024;
  gzip_vary on;

  root /usr/share/nginx/html;

  etag off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  include mime.types;
  types {
    # Manifest files
    application/manifest+json webmanifest;
  }

  # Kubernetes liveness / readiness probe endpoint
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Runtime configuration mounted via Kubernetes ConfigMap or entrypoint — never cache
  location = /config.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    try_files $uri =404;
  }

  # Service worker — never cache so browsers pick up new deploys promptly
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    try_files $uri =404;
  }

  # all assets contain hash in filename, cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;

    try_files $uri =404;
  }

  # all workbox scripts are compiled with hash in filename, cache forever
  location ^~ /workbox- {
    add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;

    try_files $uri =404;
  }

  # image assets can be cached for a month
  location /images/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;

    try_files $uri =404;
  }

  # assume that everything else is handled by the application router, by injecting the index.html
  location / {
    autoindex off;
    expires off;
    add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    try_files $uri /index.html =404;
  }

  location /404.html {
    internal;
  }

  location /50x.html {
    internal;
  }

  error_page  404              /404.html;
  error_page  500 502 503 504  /50x.html;
}
